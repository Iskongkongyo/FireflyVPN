<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'">
  <title>Firefly VPN 管理控制台</title>
  <link rel="icon" type="image/jpeg" href="./assets/firefly.jpg">
  <link rel="stylesheet" href="./assets/console.css">
</head>
<body>
  <div class="shell" id="app-shell">
    <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="隐藏侧边栏">
      <span aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <aside class="sidebar" id="sidebar">
      <div class="brand"><img class="brand-logo" src="./assets/firefly.jpg" alt="Firefly"><div><strong>Firefly</strong><small>管理控制台</small></div></div>
      <nav id="navigation">
        <button data-page="dashboard" class="active" aria-current="page">概览</button>
        <button data-page="subscriptions">订阅源</button>
        <button data-page="accounts">用户账号</button>
        <button data-page="devices">设备管理</button>
        <button data-page="analytics">统计分析</button>
        <button data-page="settings">其他设置</button>
        <button data-page="audit">审计日志</button>
      </nav>
      <button id="logout" class="quiet">退出登录</button>
    </aside>
    <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="关闭侧边栏" tabindex="-1"></button>
    <main>
      <div class="mobile-brand"><img class="brand-logo" src="./assets/firefly.jpg" alt="Firefly"><div><strong>Firefly</strong><small>管理控制台</small></div></div>
      <header><div><p class="eyebrow">FIREFLY VPN</p><h1 id="page-title">概览</h1></div><div class="header-actions"><span id="status" class="status">准备就绪</span><button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换明暗主题"><span id="theme-icon">☾</span><span id="theme-label">深色</span></button></div></header>
      <section id="content" aria-live="polite"></section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="login-dialog">
    <form id="login-form" method="dialog">
      <img class="login-logo" src="./assets/firefly.jpg" alt="Firefly">
      <h2>登录管理控制台</h2>
      <p>输入登录密码，登录状态可保持 30 天。</p>
      <label>登录密码<input id="admin-token" type="password" autocomplete="current-password" required minlength="8" maxlength="512"></label>
      <button type="submit" class="primary">登录</button>
      <p id="login-error" class="error"></p>
    </form>
  </dialog>

  <dialog id="audit-cleanup-dialog">
    <form id="audit-cleanup-form">
      <h2>清理审计日志</h2>
      <p>可按北京时间范围清理；开始或结束时间允许只填写一项。</p>
      <div class="audit-cleanup-fields">
        <label>开始时间<input name="from" type="datetime-local" step="1"></label>
        <label>结束时间<input name="to" type="datetime-local" step="1"></label>
      </div>
      <label class="check-label"><input name="all" type="checkbox">全部清理（忽略时间范围）</label>
      <div class="dialog-actions"><button class="danger" type="submit">确认清理</button><button class="secondary" id="cancel-audit-cleanup" type="button">取消</button></div>
    </form>
  </dialog>

  <script src="./assets/console.js" defer></script>
</body>
</html>
